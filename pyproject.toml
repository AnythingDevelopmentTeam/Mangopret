[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mangopret"
version = "2.2.0"
description = "Cross-platform GUI/CLI manager for zapret DPI bypass"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AnythingDevelopmentTeam"}]

dependencies = [
    "PyQt6>=6.5",
]

[project.optional-dependencies]
completion = [
    "argcomplete>=3.0",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.11",
    "pre-commit>=4",
]

[tool.setuptools.packages.find]
include = ["gui*"]

[tool.ruff.lint]
ignore = ["BLE001", "S110"]
exclude = ["pip/"]

[tool.ruff.lint.per-file-ignores]
"pip/*" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
