name: Update Check

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-check-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update checkupdate file
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          ASSET_URL=$(curl -s \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.event.release.tag_name }}" \
            | jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .url' \
            | head -1)

          if [ -n "$ASSET_URL" ] && [ "$ASSET_URL" != "null" ]; then
            HASH=$(curl -sL -H "Accept: application/octet-stream" "$ASSET_URL" | sha256sum | cut -d' ' -f1)
          else
            HASH="placeholder"
          fi

          cat > checkupdate << EOF
# Mangopret Update Check
LAST_VERSION = "${VERSION}"
VERSION_HASH = "${HASH}"
EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checkupdate
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update checkupdate to v${VERSION}"
            git push
          fi
