name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g., v2.3.0)'
        required: true
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build portable tar.gz
        run: |
          DIST="mangopret-${VERSION}-linux-$(uname -m)"
          mkdir -p "$DIST"
          cp -r gui lists bin .service "$DIST/"
          cp run.sh run_gui.sh install.sh README.md README.en.md LICENSE.txt "$DIST/"
          cp -r pip "$DIST/"
          tar czf "${DIST}.tar.gz" "$DIST"

      - name: Build AppImage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fuse libfuse2 wget
          bash packaging/linux/build-appimage.sh "${VERSION#v}"
          mv mangopret-*.AppImage . 2>/dev/null || true
          ls -la

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-bundle
          path: |
            mangopret-*.tar.gz
            mangopret-*.AppImage

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1

      - name: Compute SHA256
        run: |
          sha256sum linux-bundle/*.tar.gz linux-bundle/*.AppImage > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: |
            linux-bundle/*.tar.gz
            linux-bundle/*.AppImage
            checksums.txt
          generate_release_notes: true

      - name: Compute hash for checkupdate
        id: hash
        run: |
          HASH=$(sha256sum linux-bundle/*.tar.gz | cut -d' ' -f1 | head -1)
          echo "hash=${HASH:-placeholder}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1

      - name: Update checkupdate file
        run: |
          V="${VERSION#v}"
          printf '%s\n' \
            "# Mangopret Update Check" \
            "LAST_VERSION = \"${V}\"" \
            "VERSION_HASH = \"${{ steps.hash.outputs.hash }}\"" \
            > checkupdate
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checkupdate
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update checkupdate to v${V}"
            git push
          fi
