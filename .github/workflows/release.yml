name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g., v2.3.0)'
        required: true
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download embeddable Python
        shell: pwsh
        run: |
          $assets = (Invoke-RestMethod "https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest").assets
          $asset = $assets | Where-Object { $_.name -match 'cpython-3\.11.*x86_64-pc-windows-msvc-install_only\.tar\.gz' } | Select-Object -First 1
          if (-not $asset) { throw "No matching Python asset found" }
          $out = "$env:RUNNER_TEMP\python.tar.gz"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $out
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\python-dist"
          tar -xzf $out -C "$env:RUNNER_TEMP\python-dist"
          $py = Get-ChildItem "$env:RUNNER_TEMP\python-dist" -Recurse -Filter python.exe | Select-Object -First 1
          if (-not $py) { throw "python.exe not found in portable dist" }
          echo "PYTHON_DIR=$($py.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Bootstrap pip and install PyQt6
        shell: pwsh
        run: |
          $py = "$env:PYTHON_DIR\python.exe"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "$env:RUNNER_TEMP\get-pip.py"
          & $py "$env:RUNNER_TEMP\get-pip.py" --no-warn-script-location
          & $py -m pip install "PyQt6>=6.5" --no-warn-script-location

      - name: Bundle portable app
        shell: pwsh
        run: |
          $V = "$env:VERSION"
          $dist = "mangopret-${V}-win64"
          New-Item -ItemType Directory -Force "$dist"
          New-Item -ItemType Directory -Force "$dist\python"
          robocopy "$env:PYTHON_DIR" "$dist\python" /E /NP /NFL /NDL > $null
          Copy-Item "gui" "$dist\" -Recurse -Force
          Copy-Item "lists" "$dist\" -Recurse -Force
          Copy-Item "bin" "$dist\" -Recurse -Force
          Copy-Item "pip" "$dist\" -Recurse -Force
          Copy-Item "run.bat", "run_gui.bat", "install.sh", "README.md", "README.en.md", "LICENSE.txt" "$dist\"
          Compress-Archive -Path "$dist\*" -DestinationPath "$dist.zip" -Force

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: win64-bundle
          path: mangopret-${{ env.VERSION }}-win64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build portable tar.gz
        run: |
          DIST="mangopret-${VERSION}-linux-$(uname -m)"
          mkdir -p "$DIST"
          cp -r gui lists bin .service "$DIST/"
          cp run.sh run_gui.sh install.sh README.md README.en.md LICENSE.txt "$DIST/"
          cp -r pip "$DIST/"
          tar czf "${DIST}.tar.gz" "$DIST"

      - name: Build AppImage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fuse libfuse2 wget
          bash packaging/linux/build-appimage.sh "${VERSION#v}"
          mv mangopret-*.AppImage . 2>/dev/null || true
          ls -la

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-bundle
          path: |
            mangopret-*.tar.gz
            mangopret-*.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1

      - name: Compute SHA256
        run: |
          sha256sum win64-bundle/*.zip linux-bundle/*.tar.gz linux-bundle/*.AppImage > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: |
            win64-bundle/*.zip
            linux-bundle/*.tar.gz
            linux-bundle/*.AppImage
            checksums.txt
          generate_release_notes: true

      - name: Compute hash for checkupdate
        id: hash
        run: |
          HASH=$(sha256sum linux-bundle/*.tar.gz | cut -d' ' -f1 | head -1)
          echo "hash=${HASH:-placeholder}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1

      - name: Update checkupdate file
        run: |
          V="${VERSION#v}"
          printf '%s\n' \
            "# Mangopret Update Check" \
            "LAST_VERSION = \"${V}\"" \
            "VERSION_HASH = \"${{ steps.hash.outputs.hash }}\"" \
            > checkupdate
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checkupdate
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update checkupdate to v${V}"
            git push
          fi
