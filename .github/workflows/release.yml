name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g., v2.3.0)'
        required: true
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build portable tar.gz
        run: |
          DIST="mangopret-${VERSION}-linux-$(uname -m)"
          mkdir -p "$DIST"
          cp -r gui lists bin .service strategies "$DIST/"
          cp run.sh run_gui.sh install.sh install_bin_atomic.sh README.md README.en.md LICENSE.txt "$DIST/"
          cp -r pip "$DIST/"
          tar czf "${DIST}.tar.gz" "$DIST"

      - name: Build AppImage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fuse libfuse2 wget
          bash packaging/linux/build-appimage.sh "${VERSION#v}"
          mv mangopret-*.AppImage . 2>/dev/null || true
          ls -la

      - name: Build Windows portable zip
        run: |
          sudo apt-get install -y -qq zip
          LATEST=$(curl -sSL "https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest")
          PY_URL=$(echo "$LATEST" | grep -oP '"browser_download_url":\s*"\K[^"]*cpython-3\.11[^"]*x86_64-pc-windows-msvc-install_only\.tar\.gz' | head -1)
          curl -#SL -o /tmp/python.tar.gz "$PY_URL"
          mkdir -p /tmp/python-dist
          tar xzf /tmp/python.tar.gz -C /tmp/python-dist
          PY_DIR=$(find /tmp/python-dist -name python.exe -printf '%h\n' | head -1)
          DIST="mangopret-${VERSION}-win64"
          mkdir -p "$DIST/python"
          cp -r "$PY_DIR"/* "$DIST/python/"
          cp -r gui lists bin pip strategies "$DIST/"
          cp run.bat run_gui.bat install.sh install_bin_atomic.sh README.md README.en.md LICENSE.txt "$DIST/"
          cd "$DIST" && zip -r "../${DIST}.zip" . && cd ..

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-bundle
          path: |
            mangopret-*.tar.gz
            mangopret-*.AppImage
            mangopret-*.zip

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1

      - name: Debug artifact structure
        run: find . -type f | head -30

      - name: Compute SHA256
        run: |
          find . -maxdepth 3 \( -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.zip' \) -type f -exec sha256sum {} + > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: |
            *.tar.gz
            *.AppImage
            *.zip
            checksums.txt
          generate_release_notes: true

      - name: Compute hashes for each artifact
        id: hashes
        run: |
          V="${VERSION#v}"
          HASH_TAR=$(find . -maxdepth 3 -name '*.tar.gz' -type f -exec sha256sum {} + | head -1 | cut -d' ' -f1)
          HASH_APP=$(find . -maxdepth 3 -name '*.AppImage' -type f -exec sha256sum {} + | head -1 | cut -d' ' -f1)
          HASH_ZIP=$(find . -maxdepth 3 -name '*.zip' -type f -exec sha256sum {} + | head -1 | cut -d' ' -f1)
          echo "hash_tar=${HASH_TAR:-placeholder}" >> "$GITHUB_OUTPUT"
          echo "hash_app=${HASH_APP:-placeholder}" >> "$GITHUB_OUTPUT"
          echo "hash_zip=${HASH_ZIP:-placeholder}" >> "$GITHUB_OUTPUT"

      - name: Fetch release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$VERSION" --json body --jq .body > /tmp/release_body.txt 2>/dev/null || true
          if [ ! -s /tmp/release_body.txt ]; then
            echo "No release body found" > /tmp/release_body.txt
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: updatecheck

      - name: Update checkupdate and changelog
        run: |
          V="${VERSION#v}"
          printf '%s\n' \
            "# Mangopret Update Check" \
            "LAST_VERSION = \"${V}\"" \
            "HASH_TAR_GZ = \"${{ steps.hashes.outputs.hash_tar }}\"" \
            "HASH_APPIMAGE = \"${{ steps.hashes.outputs.hash_app }}\"" \
            "HASH_ZIP = \"${{ steps.hashes.outputs.hash_zip }}\"" \
            > checkupdate
          printf '# Changelog\n\n' > CHANGELOG.md
          cat /tmp/release_body.txt >> CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checkupdate CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update checkupdate and changelog to v${V}"
            git push
          fi
