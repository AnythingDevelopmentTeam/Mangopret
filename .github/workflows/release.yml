name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage
        run: |
          VERSION="${{ github.ref_name }}"
          sudo apt-get update -qq && sudo apt-get install -y -qq fuse libfuse2 wget
          bash packaging/linux/build-appimage.sh "${VERSION#v}"
          mv mangopret-*.AppImage mangopret-*.tar.gz* . 2>/dev/null || true
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            mangopret-*.AppImage
            mangopret-*.tar.gz

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Compute SHA256
        run: |
          sha256sum linux-bundle/*.AppImage linux-bundle/*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-bundle/*.AppImage
            linux-bundle/*.tar.gz
            checksums.txt
          generate_release_notes: true
